[package]
name = "devcopilot-persistence"
edition.workspace = true
version.workspace = true
publish.workspace = true

# SQLCipher crypto backend per OS: see docs/adr/ADR-004.md (spike S3, T011).
[dependencies]
devcopilot-application.workspace = true
devcopilot-domain.workspace = true
getrandom.workspace = true
keyring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Windows has no system crypto library SQLCipher can use; OpenSSL is vendored (ADR-004).
[target.'cfg(windows)'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
devcopilot-application = { workspace = true, features = ["test-support"] }
# T158: the at-rest scan drives the remote STT adapter against a fake server.
devcopilot-intelligence = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
