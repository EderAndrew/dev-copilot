# cargo-deny policy (Constitution Art. IV.8, VIII.3). Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Unmaintained/unsound notices fail only for crates we depend on directly; transitive notices
# (e.g. Tauri's Linux GTK stack) are reported by `cargo audit` and reviewed there.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # Mozilla CA root data bundled by rustls (webpki-root-certs).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
    # Bundled SQLCipher sources (ADR-004): SQLite is public domain ("blessing") and the embedded
    # libtomcrypt is WTFPL. Both are permissive; allowed for this crate only.
    { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

# Workspace crates are `publish = false`; they carry no license field.
[licenses.private]
ignore = true

[bans]
# Duplicate major versions are common in the Tauri/GTK graph; surface them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; they are not wildcards from a registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
