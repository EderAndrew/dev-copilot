[workspace]
resolver = "2"

members = [
    "apps/desktop/src-tauri",
    "crates/domain",
    "crates/application",
    "crates/audio",
    "crates/intelligence",
    "crates/persistence",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.metadata]
name = "devcopilot-rust"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
