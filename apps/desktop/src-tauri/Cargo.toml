[package]
name = "devcopilot-desktop"
description = "Dev Copilot desktop app"
authors = ["Eder Andrew"]
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devcopilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
devcopilot-application.workspace = true
devcopilot-audio.workspace = true
devcopilot-domain.workspace = true
devcopilot-intelligence.workspace = true
devcopilot-persistence.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
devcopilot-intelligence = { workspace = true, features = ["test-support"] }
sha2.workspace = true
wiremock.workspace = true
devcopilot-application = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
