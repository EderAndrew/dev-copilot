# Release pipeline (specs/002 T051, research R6, contracts/release-artifacts.md).
#
# A tag `v<version>` or `v<version>-rc.N` runs the CI gates, builds and signs every installer
# under the protected `release` environment (approval by the release owner), and creates a
# DRAFT GitHub release. Publishing the draft is manual, after the release checklist
# (docs/release/checklist.md). `SHA256SUMS.asc` is signed locally, never here.
#
# Fail closed (FR-005, FR-006): every signing credential is checked before the build, every
# signature is verified after it, and any failure fails the job, so no draft is created.
# Secrets are passed through `env:` only, never interpolated into scripts, and never printed.
# No build cache is restored, so nothing produced by an untrusted branch reaches a release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same gates as every PR: fmt, clippy, tests, audit, deny, gitleaks, frontend, CSP.
  gates:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  # Checks that only make sense for a release: the tag matches the version, and the shipped
  # updater public key is the real one recorded in ADR-005 (T006, T039a).
  release-config:
    name: Release configuration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libasound2-dev libpulse-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Version, updater key and bundle configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          cargo test -p devcopilot-desktop
          --test version_consistency --test updater_config --test bundle_config

  # Targets this release builds. The repository variable RELEASE_PLATFORMS narrows them to the
  # declared platforms (FR-032); unset builds all. 0.1.0 sets it to `macos-aarch64`
  # (tasks.md "Scope decision for 0.1.0"). An unknown name fails the release.
  platforms:
    name: Release platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: select
        env:
          RELEASE_PLATFORMS: ${{ vars.RELEASE_PLATFORMS }}
        run: |
          set -euo pipefail
          matrix="$(node tooling/release/release-platforms.mjs --select "${RELEASE_PLATFORMS:-}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign (${{ matrix.platform }} ${{ matrix.arch }})
    needs: [gates, release-config, platforms]
    environment: release
    strategy:
      # One failed platform means no release: stop the others early.
      fail-fast: true
      # Targets from tooling/release/release-platforms.mjs: id, os, platform, target, arch, bundles.
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libasound2-dev libpulse-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Read the app version
        run: echo "APP_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      # --- credentials check (before any build) ------------------------------------------------

      - name: Require the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::missing secret $name"; exit 1; fi
          done

      - name: Require the Apple signing and notarization credentials
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::missing secret $name"; exit 1; fi
          done

      - name: Require the Windows signing provider
        if: matrix.platform == 'windows'
        env:
          WINDOWS_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
        run: |
          if [ "${WINDOWS_SIGN_PROVIDER:-}" != "artifact-signing" ]; then
            echo "::error::vars.WINDOWS_SIGN_PROVIDER must name a provider supported by tooling/release/windows-sign.mjs"
            exit 1
          fi
          # Credentials are checked again, per file, by windows-sign.mjs.

      # --- platform signing setup --------------------------------------------------------------

      - name: Import the Developer ID certificate into a temporary keychain
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install the Windows signing tool
        if: matrix.platform == 'windows'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked

      # --- build -------------------------------------------------------------------------------

      - name: Build, sign and notarize
        env:
          # Updater signatures (.sig) for every updater package.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: the bundler signs with this identity from the keychain above (hardened
          # runtime, Entitlements.plist), then notarizes and staples the .app.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Windows: bundle.windows.signCommand → tooling/release/windows-sign.mjs.
          WINDOWS_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGN_PROVIDER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          # Linux: build the AppImage without FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm --filter appsdesktop tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # --- verification (fail closed) ----------------------------------------------------------

      - name: Sign, notarize and staple the DMG; verify macOS signatures
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          app="$(ls -d "$BUNDLE_DIR"/macos/*.app)"
          dmg="$(ls "$BUNDLE_DIR"/dmg/*.dmg)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          assessment="$(spctl -a -vv "$app" 2>&1)"
          echo "$assessment"
          grep -q "source=Notarized Developer ID" <<<"$assessment"

          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 1h \
            | tee "$RUNNER_TEMP/notary.log"
          grep -q "status: Accepted" "$RUNNER_TEMP/notary.log"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          assessment="$(spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1)"
          echo "$assessment"
          grep -q "source=Notarized Developer ID" <<<"$assessment"

          # The updater tarball must carry the same notarized, stapled app.
          check="$RUNNER_TEMP/tarball-check"
          mkdir -p "$check"
          tar -xzf "$(ls "$BUNDLE_DIR"/macos/*.app.tar.gz)" -C "$check"
          codesign --verify --deep --strict "$check"/*.app
          xcrun stapler validate "$check"/*.app

      - name: Verify Windows signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:BUNDLE_DIR/nsis/*-setup.exe") +
                   @(Get-ChildItem "target/${{ matrix.target }}/release/*.exe")
          foreach ($file in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($s.Status -ne 'Valid') { throw "$($file.Name): $($s.Status)" }
            if ($null -eq $s.TimeStamperCertificate) { throw "$($file.Name): no timestamp" }
            Write-Output "$($file.Name): $($s.SignerCertificate.Subject)"
          }

      - name: Collect the release assets
        run: >-
          node tooling/release/collect-bundle.mjs --bundle-dir "$BUNDLE_DIR"
          --out-dir release-assets --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --version "$APP_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Remove the temporary keychain and API key
        if: always() && matrix.platform == 'macos'
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # provenance attestations
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Build latest.json and SHA256SUMS
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          notes="docs/release/v$version/update-notes.txt"
          args=(--dir release-assets --version "$version" --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); fi
          node tooling/release/make-manifest.mjs "${args[@]}"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$RELEASE_TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft --verify-tag "${prerelease[@]}" \
            --title "Dev Copilot $RELEASE_TAG" \
            --notes "Draft. Verify the assets, attach SHA256SUMS.asc and complete docs/release/checklist.md before publishing."
